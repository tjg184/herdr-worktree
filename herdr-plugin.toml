id = "herdr-worktree"
name = "Herdr Worktree"
version = "1.0.0"
min_herdr_version = "0.8.0"
description = "Interactive picker for creating and switching to Git worktrees in Herdr"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "open"
title = "New worktree"
contexts = ["workspace", "global"]
command = ["./target/release/herdr-worktree", "open"]

[[actions]]
id = "remove"
title = "Remove worktree"
contexts = ["workspace"]
command = ["./target/release/herdr-worktree", "remove"]

[[panes]]
id = "picker"
title = "Worktree Picker"
placement = "overlay"
command = ["./target/release/herdr-worktree", "ui"]

[[panes]]
id = "confirm-remove"
title = "Remove worktree?"
placement = "overlay"
command = ["./target/release/herdr-worktree", "confirm-remove"]
