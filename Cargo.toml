[package]
name = "herdr-worktree"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin for creating and switching to Git worktrees"
license = "MIT"
readme = "README.md"
keywords = ["herdr", "worktree", "git", "terminal", "plugin"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync"] }
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
strip = true
